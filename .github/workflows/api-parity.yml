name: API Parity Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  api-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install requests
      - name: Start local backend
        run: |
          nohup uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 &
          # wait for it to boot
          sleep 3
      - name: Run API parity check
        env:
          PM_WORKER: ${{ secrets.PM_WORKER_URL }}
          PM_LOCAL_BACKEND: http://127.0.0.1:8000
        run: python apps/scripts/check_api_parity.py
