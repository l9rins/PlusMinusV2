name: API Parity Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  api-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install --upgrade pip requests
      - name: Run API parity check
        env:
          PM_WORKER: ${{ secrets.PM_WORKER_URL }}
          PM_LOCAL_BACKEND: ${{ secrets.PM_LOCAL_BACKEND_URL }}
        run: python apps/scripts/check_api_parity.py
